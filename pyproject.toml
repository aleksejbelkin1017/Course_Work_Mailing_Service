[project]
name = "course-work-mailing-service"
version = "0.1.0"
description = "Курсовая работа: сервис управления рассылками"
authors = [
    {name = "Aleksey Belkin", email = "aleksejbelkin1017@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "redis (>=5.0,<6.0)"
